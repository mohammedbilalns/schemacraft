name: Build Desktop Release

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: eraser-offline/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eraser-offline/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: eraser-offline
        run: pnpm install

      - name: Run unit tests
        working-directory: eraser-offline
        run: pnpm test

      - name: Build frontend & AppImage
        working-directory: eraser-offline
        run: pnpm tauri build --bundles appimage

      - name: Upload Linux AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchemaCraft-Linux-AppImage
          path: eraser-offline/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  build-windows:
    name: Build Windows Executable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: eraser-offline/src-tauri

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: eraser-offline/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: eraser-offline
        run: pnpm install

      - name: Run unit tests
        working-directory: eraser-offline
        run: pnpm test

      - name: Build Windows NSIS (.exe)
        working-directory: eraser-offline
        run: pnpm tauri build --bundles nsis

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SchemaCraft-Windows-Installer
          path: eraser-offline/src-tauri/target/release/bundle/nsis/*setup.exe
          if-no-files-found: warn
